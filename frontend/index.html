<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campfire Stories</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- The control panel: the player's choices -->
  <section id="controls">
    <h1>Campfire Stories</h1>

    <label>
      Tone
      <select id="tone">
        <option value="classic">Classic</option>
        <option value="creepy">Creepy</option>
        <option value="cozy">Cozy</option>
        <option value="folk">Folk horror</option>
        <option value="mystery">Mystery</option>
        <option value="haunted_house">Haunted house</option>
      </select>
    </label>

    <label>
      Length
      <select id="length">
        <option value="short">Short</option>
        <option value="medium" selected>Medium</option>
        <option value="long">Long</option>
      </select>
    </label>

    <label>
      Scariness <span id="scariness-value">3</span>
      <input id="scariness" type="range" min="1" max="5" value="3">
    </label>

    <label>
      Details
      <input id="details" type="text" maxlength="300"
             placeholder="a lighthouse, an old dog, a missing hiker...">
    </label>
  </section>

  <!-- The fire, with a hardware panel on each side -->
  <section id="stage">
    <aside class="panel">
      <h2>GPU</h2>
      <div class="meter"><div id="gpu-bar" class="meter-fill"></div></div>
      <p><span id="gpu-value">0</span>% busy</p>
      <p><span id="temp-value">--</span> °C</p>
      <p><span id="power-value">--</span> W</p>
    </aside>

    <button id="fire" aria-label="Tell me a story">
      <div class="flames">
        <div class="flame"></div>
        <div class="flame"></div>
        <div class="flame"></div>
      </div>
      <div class="logs"></div>
    </button>

   <aside class="panel">
      <h2>Memory</h2>
      <div class="meter"><div id="mem-bar" class="meter-fill"></div></div>
      <p><span id="mem-value">--</span> / <span id="mem-total">--</span> GB</p>
      <p class="hint">Shared by CPU and GPU</p>
    </aside>
  </section>

  <p id="status">Tap the fire for a story</p>

  <!-- Where the story appears -->
  <article id="story"></article>

  <script src="app.js"></script>
</body>
</html>
